<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SL Tonight Comics — The Funny Papers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Special+Elite&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-dim: #8a6d2f;
    --cream: #f0e6c8;
    --dark: #0a0804;
    --dark-mid: #13100a;
    --dark-warm: #1a1410;
    --red: #8b1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
    pointer-events: none;
    z-index: 1000;
  }
  /* NAV */
  .nav {
    padding: 1rem 2rem;
    border-bottom: 1px solid rgba(201,168,76,0.15);
    background: var(--dark-mid);
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .nav a {
    font-family: 'Special Elite', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--gold-dim);
    transition: color 0.2s;
  }
  .nav a:hover { color: var(--gold); }
  .nav-sep { color: rgba(201,168,76,0.3); }

  /* MARQUEE HEADER */
  .marquee-header {
    background: var(--dark-mid);
    border-bottom: 3px solid var(--gold-dim);
    padding: 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .marquee-lights { display: flex; justify-content: center; gap: 12px; margin-bottom: 1rem; }
  .bulb {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--gold);
    animation: blink 1.5s ease-in-out infinite;
  }
  .bulb:nth-child(even) { animation-delay: 0.75s; }
  .bulb:nth-child(3n) { animation-delay: 0.5s; }
  @keyframes blink { 0%,100% { opacity:1; box-shadow:0 0 6px var(--gold); } 50% { opacity:0.2; } }

  .drive-in-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.8rem, 6vw, 3.5rem);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.3);
    letter-spacing: 0.05em;
  }
  .drive-in-sub {
    font-family: 'Special Elite', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-top: 0.4rem;
  }

  /* SCREEN — COMIC READER */
  .screen-wrapper {
    max-width: 1000px;
    margin: 3rem auto;
    padding: 0 1rem;
  }
  .screen-frame {
    background: #000;
    border: 4px solid #2a2018;
    box-shadow: 0 0 0 2px var(--gold-dim), 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
    position: relative;
    height: 85vh;
    min-height: 600px;
  }
  .screen-frame iframe {
    width: 100%; 
    height: 100%; 
    display: block; 
    border: none;
  }
  .screen-label {
    margin-top: 1.5rem;
    text-align: center;
    font-family: 'Special Elite', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
  }

  /* FOOTER */
  footer {
    border-top: 1px solid rgba(201,168,76,0.12);
    padding: 2rem;
    text-align: center;
    margin-top: 3rem;
    background: var(--dark-mid);
  }
  .footer-tag {
    font-family: 'Special Elite', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
    text-transform: uppercase;
  }
</style>
</head>
<body>

  </div>
  <div class="screen-label">
    Now Reading from the Archive • Beverly Hillbillies #1 and more • Use arrow keys or the built-in controls
  </div>

<footer>
  <div class="footer-tag">The Funny Papers · SL Tonight · Public Domain Comics</div>
  <div class="footer-tag" style="font-size:0.5rem;opacity:0.4;margin-top:0.5rem;">
    <a href="index.html" style="color:inherit;text-decoration:none;">www.sltonight.com</a>
  </div>
</footer>

</body>
</html>
